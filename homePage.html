<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de TIX via n8n</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; background: #fff; padding: 20px; border-radius: 8px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        #loading { display: none; margin-top: 15px; color: #0056b3; font-weight: bold; text-align: center; }
        #resultado { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta de Colorantes (TIX)</h2>
    <div class="form-group">
        <label for="estab">Estabelecimento (Estab):</label>
        <input type="text" id="estab">
    </div>
    <div class="form-group">
        <label for="codigo_cliente">Código do Cliente:</label>
        <input type="text" id="codigo_cliente">
    </div>
    <div class="form-group">
        <label for="id_nota">ID da Nota:</label>
        <input type="text" id="id_nota">
    </div>
    <button onclick="buscarTix()">Pesquisar</button>

    <div id="loading">Buscando dados no n8n...</div>
    <div id="resultado"></div>
</div>
<script>
    async function buscarTix() {
        const estab = document.getElementById('estab').value;
        const codigo_cliente = document.getElementById('codigo_cliente').value;
        const id_nota = document.getElementById('id_nota').value;
        const divResultado = document.getElementById('resultado');
        const loading = document.getElementById('loading');

        if (!estab && !codigo_cliente && !id_nota) {
            alert('Por favor, preencha pelo menos um campo para realizar a pesquisa.');
            return;
        }

        let urlParams = [];
        if (estab) urlParams.push(`estab=${estab}`);
        if (codigo_cliente) urlParams.push(`codigo_cliente=${codigo_cliente}`);
        if (id_nota) urlParams.push(`id_nota=${id_nota}`);

        const webhookBaseUrl = 'https://n8n.tintomax.com.br/webhook/16937276-8a3e-4150-aa4c-f26299a772e1';
        const webhookUrl = `${webhookBaseUrl}?${urlParams.join('&')}`;

        divResultado.innerHTML = '';
        loading.style.display = 'block';

        try {
            const resposta = await fetch(webhookUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (!resposta.ok) throw new Error('Erro na comunicação com o n8n');
            
            const textoResposta = await resposta.text();
            
            if (!textoResposta) {
                throw new Error('O servidor não devolveu nenhum dado (resposta vazia).');
            }

            const dados = JSON.parse(textoResposta);
            loading.style.display = 'none';

            if (Array.isArray(dados) && dados.length > 0 && dados[0].ESTAB !== undefined) {
                let tabelaHtml = `
                    <table>
                        <tr>
                            <th>Estab</th>
                            <th>ID Nota</th>
                            <th>ID Item</th>
                            <th>ID Fórmula</th>
                            <th>ID Corante</th>
                            <th>Nome Corante</th>
                            <th>Quantidade</th>
                        </tr>`;
                
                // Conjunto para monitorar chaves únicas já inseridas na tela
                const registrosVistos = new Set();

                dados.forEach(item => {
                    const qtd = (item.QTDE !== null && item.QTDE !== undefined) ? item.QTDE : '-';
                    const idCorante = (item.IDCORANTE !== null && item.IDCORANTE !== undefined) ? item.IDCORANTE : '-';
                    const nomeCorante = item.NOME_CORANTE || '-';
                    
                    // Cria uma chave única para identificar a linha real de consumo
                    const chaveUnica = `${item.ESTAB}-${item.IDNOTA}-${item.IDITEM}-${item.IDFORMULA}-${idCorante}-${qtd}`;

                    // Se esta combinação exata já foi adicionada, ignora a repetição
                    if (registrosVistos.has(chaveUnica)) {
                        return; 
                    }
                    registrosVistos.add(chaveUnica);

                    tabelaHtml += `
                        <tr>
                            <td>${item.ESTAB || '-'}</td>
                            <td>${item.IDNOTA || '-'}</td>
                            <td>${item.IDITEM || '-'}</td>
                            <td>${item.IDFORMULA || '-'}</td>
                            <td>${idCorante}</td>
                            <td>${nomeCorante}</td>
                            <td>${qtd}</td>
                        </tr>`;
                });
                
                tabelaHtml += `</table>`;
                divResultado.innerHTML = tabelaHtml;
            } else {
                divResultado.innerHTML = '<p style="color: orange;">Nenhuma fórmula ou corante encontrado para estes dados.</p>';
            }

        } catch (erro) {
            loading.style.display = 'none';
            divResultado.innerHTML = `<p style="color: red;">Erro: ${erro.message}</p>`;
        }
    }
</script>

</body>
</html>
